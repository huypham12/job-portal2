components:
  schemas:
    # ============================================
    # Application Schemas
    # ============================================
    ApplicationStatus:
      type: string
      enum: [pending, reviewed, accepted, rejected, withdrawn]
      description: Status of a job application

    CreateApplicationRequest:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          format: uuid
          description: ID of the job being applied for
        resume_id:
          type: string
          format: uuid
          description: ID of the resume to attach (optional)
        metadata:
          type: object
          additionalProperties: true
          description: Additional application metadata (e.g., cover letter)
          example:
            cover_letter: 'I am excited to apply for this position...'

    SubmitStageFeedbackRequest:
      type: object
      required: [candidate_feedback]
      properties:
        candidate_feedback:
          type: string
          minLength: 1
          description: Candidate's feedback about the interview/evaluation stage

    ManageShortlistRequest:
      type: object
      required: [application_id, action]
      properties:
        application_id:
          type: string
          format: uuid
          description: ID of the application to manage
        action:
          type: string
          enum: [add, remove]
          description: Action to perform on the shortlist
        note:
          type: string
          description: Optional note about why candidate was added/removed

    CompareCandidatesRequest:
      type: object
      required: [application_ids]
      properties:
        application_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 2
          maxItems: 10
          description: Array of application IDs to compare (2-10 candidates)

    UpdateApplicationStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        notes:
          type: string
          description: Optional notes about the status change

    UpdateApplicationStageRequest:
      type: object
      required: [stage_id, status]
      properties:
        stage_id:
          type: string
          format: uuid
          description: ID of the stage to update
        status:
          type: string
          minLength: 1
          maxLength: 50
          description: New status for the stage
        notes:
          type: string
          description: Optional notes about the stage update

    CreateApplicationStageRequest:
      type: object
      required: [stage_type, title]
      properties:
        stage_type:
          type: string
          enum: [application_review, phone_screening, interview, assessment, offer, background_check]
          description: Type of application stage
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Title of the stage
        description:
          type: string
          description: Description of what happens in this stage
        scheduled_at:
          type: string
          format: date-time
          description: When this stage is scheduled
        location:
          type: string
          description: Location or meeting details
        interviewer_ids:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of interviewers assigned to this stage

    AddApplicationNotesRequest:
      type: object
      required: [notes]
      properties:
        notes:
          type: string
          minLength: 1
          description: Internal notes about the application
        note_type:
          type: string
          enum: [evaluation, feedback, decision, general]
          default: general
          description: Type of notes
        is_private:
          type: boolean
          default: true
          description: Whether notes are private to recruiters only

    ContactCandidateRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          description: Message to send to the candidate
        contact_method:
          type: string
          enum: [email, notification, both]
          default: email
          description: How to contact the candidate
        subject:
          type: string
          description: Email subject (required if contact_method includes email)
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
          description: Message priority

    BulkUpdateApplicationsRequest:
      type: object
      required: [application_ids, updates]
      properties:
        application_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 50
          description: Array of application IDs to update
        updates:
          type: object
          description: Updates to apply to all selected applications
          properties:
            status:
              $ref: '#/components/schemas/ApplicationStatus'
            notes:
              type: string
              description: Notes to add to each application
