# ============================================
# CONNECTION INTEREST ENDPOINTS
# ============================================
/connection-interests/stats:
  get:
    tags: [connection-interests]
    summary: Get connection interest stats
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }

/connection-interests:
  post:
    tags: [connection-interests]
    summary: Create connection interest (Recruiter)
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateConnectionInterestRequest'
    responses:
      '201': { description: Created }
      '400': { description: Validation error }
      '401': { description: Unauthorized }
      '403': { description: Forbidden }
  get:
    tags: [connection-interests]
    summary: List connection interests
    security: [{ bearerAuth: [] }]
    parameters:
      - in: query
        name: page
        schema: { type: integer, default: 1 }
      - in: query
        name: limit
        schema: { type: integer, default: 20 }
      - in: query
        name: status
        schema: { type: string, enum: [pending, accepted, rejected, expired] }
      - in: query
        name: interest_type
        schema: { type: string, enum: [job_invitation, profile_view, network_connection] }
      - in: query
        name: role
        schema: { type: string, enum: [sent, received] }
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }

/connection-interests/{id}:
  get:
    tags: [connection-interests]
    summary: Get connection interest by id
    security: [{ bearerAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }
      '404': { description: Not found }
  delete:
    tags: [connection-interests]
    summary: Delete connection interest (Recruiter)
    security: [{ bearerAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: Deleted }
      '401': { description: Unauthorized }
      '403': { description: Forbidden }

/connection-interests/{id}/respond:
  patch:
    tags: [connection-interests]
    summary: Respond to connection interest (Candidate)
    security: [{ bearerAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespondConnectionInterestRequest'
    responses:
      '200': { description: Updated }
      '401': { description: Unauthorized }
      '403': { description: Forbidden }
