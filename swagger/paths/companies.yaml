# ============================================
# COMPANY ENDPOINTS
# ============================================

/companies:
  post:
    tags: [companies]
    summary: Create company profile
    description: Create a new company profile for the authenticated recruiter
    operationId: createCompany
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateCompanyRequest'
          example:
            name: 'Công ty Cổ phần Công nghệ ABC'
            description: 'Chuyên cung cấp giải pháp phần mềm cho doanh nghiệp'
            logo_url: 'https://example.com/logo.png'
            size: 100
            contact_email: 'contact@abc-tech.com'
            contact_phone: '+84 28 1234 5678'
            contact_address: '123 Đường ABC, Quận 1, TP.HCM'
            linkedin_url: 'https://linkedin.com/company/abc-tech'
            facebook_url: 'https://facebook.com/abc-tech'
            twitter_url: 'https://twitter.com/abc_tech'
            tax_code: '1234567890'
            business_license: 'GP-123456'
    responses:
      '201':
        description: Company profile created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 201
              message: 'Company profile created successfully'
              data:
                id: '123e4567-e89b-12d3-a456-426614174000'
                name: 'Công ty Cổ phần Công nghệ ABC'
                recruiter_id: '123e4567-e89b-12d3-a456-426614174001'
      '400':
        description: Bad request - Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Recruiter role required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: Conflict - Recruiter already has a company profile
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/companies/{id}:
  get:
    tags: [companies]
    summary: Get company profile by ID
    description: Get detailed information about a company by its ID (public endpoint)
    operationId: getCompanyById
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Company ID (UUID format)
        example: '123e4567-e89b-12d3-a456-426614174000'
      - name: details
        in: query
        schema:
          type: boolean
          default: false
        description: Include detailed company information
        example: true
    responses:
      '200':
        description: Company profile retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'Company retrieved successfully'
              data:
                id: '123e4567-e89b-12d3-a456-426614174000'
                name: 'Công ty Cổ phần Công nghệ ABC'
                description: 'Chuyên cung cấp giải pháp phần mềm...'
                logo_url: 'https://example.com/logo.png'
                size: 100
      '400':
        description: Bad request - Invalid UUID format
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Company not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/companies/me:
  get:
    tags: [companies]
    summary: Get my company profile
    description: Get the company profile owned by the authenticated recruiter
    operationId: getMyCompany
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Company profile retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'Company profile retrieved successfully'
              data:
                id: '123e4567-e89b-12d3-a456-426614174000'
                name: 'Công ty Cổ phần Công nghệ ABC'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Recruiter role required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Company profile not found - Recruiter hasn't created one yet
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  patch:
    tags: [companies]
    summary: Update my company profile
    description: Update the company profile owned by the authenticated recruiter
    operationId: updateMyCompany
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateCompanyRequest'
          example:
            name: 'Công ty Cổ phần Công nghệ ABC (Updated)'
            description: 'Updated company description'
            logo_url: 'https://example.com/new-logo.png'
            size: 150
    responses:
      '200':
        description: Company profile updated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'Company profile updated successfully'
      '400':
        description: Bad request - Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Recruiter role required or not company owner
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Company profile not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

