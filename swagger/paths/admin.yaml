/admin/jobs/{id}/reject:
  patch:
    tags: [admin]
    summary: Reject job posting (Admin only)
    description: |-
      Reject a job posting with reason.
      Requires admin role and verified account.
    operationId: rejectJob
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        description: Job ID (UUID)
        required: true
        schema:
          type: string
          format: uuid
        example: '123e4567-e89b-12d3-a456-426614174000'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - reason
            properties:
              reason:
                type: string
                minLength: 10
                maxLength: 500
                description: Reason for rejection
                example: 'Job posting violates community guidelines.'
          example:
            reason: 'Job posting violates community guidelines and contains inappropriate content.'
    responses:
      '200':
        description: Job rejected successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              message: 'Từ chối tin tuyển dụng thành công.'
      '400':
        description: Bad request - Validation error or body is empty
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Admin access required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Job not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '422':
        description: Unprocessable Entity - Validation error (invalid UUID format)
        content:
