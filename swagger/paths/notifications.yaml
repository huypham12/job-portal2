# ============================================
# NOTIFICATION ENDPOINTS
# ============================================
/notifications/unread-count:
  get:
    tags: [notifications]
    summary: Get unread notification count
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }

/notifications/mark-all-read:
  patch:
    tags: [notifications]
    summary: Mark all notifications as read
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }

/notifications:
  get:
    tags: [notifications]
    summary: Get paginated list of notifications
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }

/notifications/{id}/read:
  patch:
    tags: [notifications]
    summary: Mark a notification as read
    security: [{ bearerAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }

/notifications/{id}:
  delete:
    tags: [notifications]
    summary: Delete a notification
    security: [{ bearerAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }

/notifications/send-popular-job-alerts:
  post:
    tags: [notifications]
    summary: Send alerts about trending/popular jobs
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }

/notifications/send-location-based-alerts:
  post:
    tags: [notifications]
    summary: Send job alerts based on user's preferred locations
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }

/notifications/send-search-based-alerts:
  post:
    tags: [notifications]
    summary: Send job alerts based on user's saved searches
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }

/notifications/enhanced-stats:
  get:
    tags: [notifications]
    summary: Get statistics about enhanced notifications
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }
