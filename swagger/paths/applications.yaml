# ============================================
# RECRUITER ENDPOINTS
# ============================================

/applications/recruiter/job/{jobId}:
  get:
    tags: [applications]
    summary: Get applications for a job
    description: Get all applications for a specific job posting (recruiter who owns the job)
    operationId: getApplicationsByJob
    security:
      - bearerAuth: []
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Job ID (UUID format)
        example: '123e4567-e89b-12d3-a456-426614174000'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number for pagination
        example: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Number of applications per page
        example: 20
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
        description: Filter by application status
        example: 'pending'
      - name: stage
        in: query
        schema:
          type: string
        description: Filter by current stage
        example: 'initial_screening'
      - name: skills
        in: query
        schema:
          type: array
          items:
            type: string
        description: Filter by required skills (comma-separated)
        example: ['JavaScript', 'React', 'Node.js']
      - name: experience_min
        in: query
        schema:
          type: integer
          minimum: 0
        description: Minimum years of experience
        example: 2
      - name: experience_max
        in: query
        schema:
          type: integer
          minimum: 0
        description: Maximum years of experience
        example: 5
      - name: location
        in: query
        schema:
          type: string
        description: Filter by candidate location
        example: 'Ho Chi Minh City'
      - name: sort_by
        in: query
        schema:
          type: string
          enum: [applied_at, rating, name, experience, salary]
          default: applied_at
        description: Sort field
        example: applied_at
      - name: order
        in: query
        schema:
          type: string
          enum: [asc, desc]
          default: desc
        description: Sort order
        example: desc
    responses:
      '200':
        description: Applications retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'Applications retrieved successfully'
              data:
                applications: []
                pagination:
                  page: 1
                  limit: 20
                  total: 0
                  totalPages: 0
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Only the job owner can access applications
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Job not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

