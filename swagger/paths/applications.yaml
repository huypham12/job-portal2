/applications/candidate/{applicationId}/documents:
  get:
    tags: [applications]
    summary: Get application documents
    description: Get list of documents uploaded for this application
    operationId: getApplicationDocuments
    security:
      - bearerAuth: []
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Application ID (UUID format)
        example: '123e4567-e89b-12d3-a456-426614174000'
    responses:
      '200':
        description: Application documents retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'Application documents retrieved successfully'
              data:
                documents: []
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Only the application owner can access documents
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Application not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  post:
    tags: [applications]
    summary: Upload application document
    description: Upload additional document for an application (candidate who owns the application)
    operationId: uploadDocument
    security:
      - bearerAuth: []
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Application ID (UUID format)
        example: '123e4567-e89b-12d3-a456-426614174000'
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
              - document_type
            properties:
              file:
                type: string
                format: binary
                description: Document file to upload
              document_type:
                type: string
                maxLength: 50
                description: Type of document (e.g., portfolio, certificate)
                example: 'portfolio'
    responses:
      '201':
        description: Document uploaded successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 201
              message: 'Document uploaded successfully'
      '400':
        description: Bad request - Invalid file or validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Only the application owner can upload documents
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Application not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

