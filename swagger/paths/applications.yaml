# ============================================
# APPLICATION ENDPOINTS
# ============================================

# ============================================
# CANDIDATE ENDPOINTS
# ============================================

/applications/candidate:
  post:
    tags: [applications]
    summary: Create a new job application
    description: Submit an application for a job posting (candidate only)
    operationId: createApplication
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateApplicationRequest'
          example:
            job_id: '123e4567-e89b-12d3-a456-426614174000'
            resume_id: '123e4567-e89b-12d3-a456-426614174001'
            metadata:
              cover_letter: 'I am very interested in this position...'
    responses:
      '201':
        description: Application created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 201
              message: 'Application submitted successfully'
      '400':
        description: Bad request - Validation error or already applied
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Candidate role required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  get:
    tags: [applications]
    summary: Get my applications
    description: Get paginated list of applications submitted by the authenticated candidate
    operationId: getMyApplications
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number for pagination
        example: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Number of applications per page
        example: 20
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
        description: Filter by application status
        example: 'pending'
      - name: sort_by
        in: query
        schema:
          type: string
          enum: [applied_at, status]
          default: applied_at
        description: Sort field
        example: applied_at
      - name: order
        in: query
        schema:
          type: string
          enum: [asc, desc]
          default: desc
        description: Sort order
        example: desc
    responses:
      '200':
        description: Applications retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'Applications retrieved successfully'
              data:
                applications: []
                pagination:
                  page: 1
                  limit: 20
                  total: 0
                  totalPages: 0
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Candidate role required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/applications/candidate/{applicationId}:
  get:
    tags: [applications]
    summary: Get application details
    description: Get detailed information about a specific application (candidate who owns the application)
    operationId: getApplicationById
    security:
      - bearerAuth: []
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Application ID (UUID format)
        example: '123e4567-e89b-12d3-a456-426614174000'
    responses:
      '200':
        description: Application details retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'Application retrieved successfully'
              data: {}
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Only the application owner can access details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Application not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  delete:
    tags: [applications]
    summary: Withdraw application
    description: Withdraw/cancel a job application (candidate who owns the application)
    operationId: withdrawApplication
    security:
      - bearerAuth: []
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Application ID (UUID format)
        example: '123e4567-e89b-12d3-a456-426614174000'
    responses:
      '200':
        description: Application withdrawn successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'Application withdrawn successfully'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Only the application owner can withdraw
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Application not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

