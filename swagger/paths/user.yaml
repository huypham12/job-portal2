/user/me/profile/experiences:
  get:
    tags: [user]
    summary: Get list of profile experiences (candidate)
    security: [{ bearerAuth: [] }]
    parameters:
      - in: query
        name: page
        schema: { type: integer, default: 1 }
      - in: query
        name: limit
        schema: { type: integer, default: 20 }
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }
  post:
    tags: [user]
    summary: Create a new profile experience
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              company_name: { type: string }
              position: { type: string }
              start_date: { type: string, format: date-time }
              end_date: { type: string, format: date-time, nullable: true }
              is_current: { type: boolean }
              description: { type: string }
    responses:
      '201': { description: Created }
      '400': { description: Validation error }
      '401': { description: Unauthorized }

