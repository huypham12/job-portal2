# ============================================
# USER ENDPOINTS
# ============================================

/user/me:
  get:
    tags: [user]
    summary: Get current user profile
    description: Get detailed information about the currently authenticated user including profile, companies (for recruiters), and resumes (for candidates).
    operationId: getMe
    security:
      - bearerAuth: []
    responses:
      '200':
        description: User profile retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileResponse'
            example:
              id: '123e4567-e89b-12d3-a456-426614174000'
              email: 'john.doe@example.com'
              role: 'candidate'
              verified: true
              profiles:
                - name: 'John Doe'
                  phone: '+1234567890'
                  metadata:
                    avatar: 'https://example.com/avatar.jpg'
                    bio: 'Software developer'
              companies: []
              resumes:
                - id: '123e4567-e89b-12d3-a456-426614174001'
                  content:
                    skills: ['JavaScript', 'TypeScript']
                    experience_years: 5
                  file_url: 'https://example.com/resume.pdf'
                  updated_at: '2024-01-01T00:00:00.000Z'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/user/profiles/{id}/public:
  get:
    tags: [user]
    summary: Get public profile of candidate (Recruiter only)
    description: Get public profile information of a candidate for recruiters to view
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Profile ID
    responses:
      '200':
        description: Public profile retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicProfileResponse'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Recruiter access required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Profile not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/user/me/profile:
  get:
    tags: [user]
    summary: Get complete profile with all sub-entities
    description: Get complete profile including experiences, educations, skills, certifications, awards
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Complete profile retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteProfileResponse'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  post:
    tags: [user]
    summary: Create new profile
    description: Create a new profile for the authenticated candidate
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateProfileRequest'
          example:
            name: 'John Doe'
            phone: '+1234567890'
            location_id: '123e4567-e89b-12d3-a456-426614174000'
            metadata:
              avatar: 'https://example.com/avatar.jpg'
              bio: 'Software developer with 5 years experience'
    responses:
      '201':
        description: Profile created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileResponse'
      '400':
        description: Bad request - Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  put:
    tags: [user]
    summary: Update profile
    description: Update main profile information. At least one field must be provided.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateProfileRequest'
          example:
            name: 'John Doe Updated'
            phone: '+1234567890'
            location_id: '123e4567-e89b-12d3-a456-426614174000'
            metadata:
              avatar: 'https://example.com/avatar.jpg'
              bio: 'Updated bio'
    responses:
      '200':
        description: Profile updated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileResponse'
      '400':
        description: Bad request - Validation error or empty request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Profile not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

# ================================
# EXPERIENCES ENDPOINTS
# ================================

/user/me/profile/experiences:
  get:
    tags: [user]
    summary: Get all experiences with pagination
    description: Get paginated list of user's work experiences
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: 'Page number (default: 1)'
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
        example: 1
      - name: limit
        in: query
        description: 'Items per page (default: 20)'
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        example: 20
    responses:
      '200':
        description: Experiences retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperiencesResponse'
            example:
              message: 'Experiences retrieved successfully'
              data:
                experiences:
                  - id: '123e4567-e89b-12d3-a456-426614174000'
                    company_name: 'Tech Corp'
                    position: 'Senior Developer'
                    start_date: '2020-01-01'
                    end_date: '2023-12-31'
                    description: 'Led development team...'
                    is_current: false
                pagination:
                  total: 5
                  page: 1
                  limit: 20
                  totalPages: 1
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  post:
    tags: [user]
    summary: Create new experience
    description: Add a new work experience to the profile
