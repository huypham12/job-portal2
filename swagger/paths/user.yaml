# ============================================
# USER ENDPOINTS
# ============================================
/user/me:
  get:
    tags:
      - user
    summary: Get current user profile
    description: Get detailed information about the currently authenticated user including profile, companies (for recruiters), and resumes (for candidates).
    operationId: getMe
    security:
      - bearerAuth: []
    responses:
      '200':
        description: User profile retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileResponse'
            example:
              id: '123e4567-e89b-12d3-a456-426614174000'
              email: 'john.doe@example.com'
              role: 'candidate'
              verified: true
              profiles:
                - name: 'John Doe'
                  phone: '+1234567890'
                  metadata:
                    avatar: 'https://example.com/avatar.jpg'
                    bio: 'Software developer'
              companies: []
              resumes:
                - id: '123e4567-e89b-12d3-a456-426614174001'
                  content:
                    skills: ['JavaScript', 'TypeScript']
                    experience_years: 5
                  file_url: 'https://example.com/resume.pdf'
                  updated_at: '2024-01-01T00:00:00.000Z'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: User not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/user/me/profile:
  put:
    tags:
      - user
    summary: Update user profile
    description: Update profile information for the currently authenticated user. At least one field must be provided.
    operationId: updateProfile
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateProfileRequest'
          example:
            name: 'John Doe Updated'
            phone: '+1234567890'
            location_id: '123e4567-e89b-12d3-a456-426614174000'
            metadata:
              avatar: 'https://example.com/avatar.jpg'
              bio: 'Updated bio'
    responses:
      '200':
        description: Profile updated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileResponse'
            example:
              message: 'Profile updated'
              profile:
                id: '123e4567-e89b-12d3-a456-426614174002'
                user_id: '123e4567-e89b-12d3-a456-426614174000'
                name: 'John Doe Updated'
                phone: '+1234567890'
                location_id: '123e4567-e89b-12d3-a456-426614174000'
                metadata:
                  avatar: 'https://example.com/avatar.jpg'
                  bio: 'Updated bio'
                updated_at: '2024-01-01T00:00:00.000Z'
                created_at: '2024-01-01T00:00:00.000Z'
      '400':
        description: Bad request - Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/user/profiles/{id}/public:
  get:
    tags:
      - user
    summary: Get public profile of candidate (Recruiter only)
    description: |-
      Get public profile information of a candidate by profile ID.
      This endpoint allows recruiters to view candidate profiles for recruitment purposes.
      Sensitive information like phone number and email are excluded from the response.
    operationId: getPublicProfile
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        description: Profile ID (UUID)
        required: true
        schema:
          type: string
          format: uuid
        example: '123e4567-e89b-12d3-a456-426614174000'
    responses:
      '200':
        description: Public profile retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PublicProfileResponse'
            example:
              success: true
              message: 'Profile retrieved successfully'
              data:
                id: '123e4567-e89b-12d3-a456-426614174000'
                full_name: 'John Doe'
                display_name: 'John'
                headline: 'Senior Software Engineer'
                avatar_url: 'https://example.com/avatar.jpg'
                bio: 'Experienced software developer'
                years_of_experience: 5
                desired_job_title: 'Full Stack Developer'
                desired_salary_min: 20000000
                desired_currency: 'VND'
                desired_job_type: ['full_time', 'remote']
                is_looking_for_job: true
                location_text: 'Ho Chi Minh City'
                personal_website: 'https://johndoe.dev'
                linkedin_url: 'https://linkedin.com/in/johndoe'
                github_url: 'https://github.com/johndoe'
                role: 'candidate'
                location:
                  id: '123e4567-e89b-12d3-a456-426614174001'
                  name: 'Ho Chi Minh City'
                  type: 'city'
                experiences: []
                educations: []
                skills: []
                certifications: []
                awards: []
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Recruiter access required or profile not available for public viewing
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
              success: false
              message: 'This profile is not available for public viewing'
      '404':
        description: Profile not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
              success: false
              message: 'Profile not found'
      '422':
        description: Unprocessable Entity - Invalid UUID format
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

