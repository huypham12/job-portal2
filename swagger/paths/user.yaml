# ================================
# PROFILE VISIBILITY & COMPLETENESS
# ================================

/user/me/profile/visibility:
  put:
    tags: [user]
    summary: Update profile visibility
    description: Update profile visibility settings (public/private)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - is_public
            properties:
              is_public:
                type: boolean
                description: Whether the profile is publicly visible
                example: true
          example:
            is_public: true
    responses:
      '200':
        description: Profile visibility updated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              message: 'Profile visibility updated successfully'
      '400':
        description: Bad request - Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/user/me/profile/completeness:
  get:
    tags: [user]
    summary: Get profile completeness percentage
    description: Calculate and return the profile completeness percentage based on filled sections
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Profile completeness calculated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Profile completeness calculated successfully'
                data:
                  type: object
                  properties:
                    completeness_percentage:
                      type: number
                      minimum: 0
                      maximum: 100
                      example: 85
                    completed_sections:
                      type: array
                      items:
                        type: string
                        enum: [basic_info, experiences, educations, skills, certifications, awards]
                      example: ['basic_info', 'experiences', 'educations', 'skills']
                    missing_sections:
                      type: array
                      items:
                        type: string
                        enum: [basic_info, experiences, educations, skills, certifications, awards]
                      example: ['certifications', 'awards']
            example:
              message: 'Profile completeness calculated successfully'
              data:
                completeness_percentage: 85
                completed_sections: ['basic_info', 'experiences', 'educations', 'skills']
                missing_sections: ['certifications', 'awards']
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'