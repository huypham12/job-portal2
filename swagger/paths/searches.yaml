# ============================================
# SEARCH ENDPOINTS
# ============================================
/search/jobs:
  get:
    tags: [searches]
    summary: Search jobs
    responses:
      '200': { description: OK }

/search/suggestions:
  get:
    tags: [searches]
    summary: Get search suggestions
    responses:
      '200': { description: OK }

/search/events:
  post:
    tags: [searches]
    summary: Track search events
    responses:
      '200': { description: OK }

/search/recent:
  get:
    tags: [searches]
    summary: Get recent searches
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }
  delete:
    tags: [searches]
    summary: Clear recent searches
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }

/search/recent/{id}:
  delete:
    tags: [searches]
    summary: Delete recent search
    security: [{ bearerAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }

/search/popular-queries:
  get:
    tags: [searches]
    summary: Get popular search queries
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }
