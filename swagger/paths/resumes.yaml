# ============================================
# RESUME ENDPOINTS
# ============================================
/resumes/themes:
  get:
    tags: [resumes]
    summary: List resume themes (Candidate)
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }

/resumes/from-profile:
  post:
    tags: [resumes]
    summary: Create resume from profile (Candidate)
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateResumeFromProfileRequest'
    responses:
      '201': { description: Created }
      '400': { description: Validation error }
      '401': { description: Unauthorized }

/resumes:
  post:
    tags: [resumes]
    summary: Create resume (manual)
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateResumeRequest'
    responses:
      '201': { description: Created }
      '400': { description: Validation error }
      '401': { description: Unauthorized }
  get:
    tags: [resumes]
    summary: List resumes (Candidate)
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }

/resumes/{id}:
  get:
    tags: [resumes]
    summary: Get resume by id
    security: [{ bearerAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }
      '404': { description: Not found }
  put:
    tags: [resumes]
    summary: Update resume
    security: [{ bearerAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateResumeRequest'
    responses:
      '200': { description: Updated }
      '400': { description: Validation error }
      '401': { description: Unauthorized }
  delete:
    tags: [resumes]
    summary: Delete resume
    security: [{ bearerAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: Deleted }
      '401': { description: Unauthorized }

/resumes/{id}/default:
  patch:
    tags: [resumes]
    summary: Set resume as default
    security: [{ bearerAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: Updated }
      '401': { description: Unauthorized }

/resumes/upload:
  post:
    tags: [resumes]
    summary: Upload resume file with auto-parse
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
              title:
                type: string
              auto_parse:
                type: boolean
              is_default:
                type: boolean
    responses:
      '200': { description: Uploaded }
      '401': { description: Unauthorized }

/resumes/{id}/download:
  get:
    tags: [resumes]
    summary: Download resume file
    security: [{ bearerAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: File stream }
      '401': { description: Unauthorized }

/resumes/{id}/export:
  post:
    tags: [resumes]
    summary: Export resume to PDF/HTML
    security: [{ bearerAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExportResumeRequest'
    responses:
      '200': { description: Exported }
      '401': { description: Unauthorized }

/resumes/{id}/preview:
  get:
    tags: [resumes]
    summary: Preview resume HTML
    security: [{ bearerAuth: [] }]
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }
