          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/jobs/{id}:
  put:
    tags: [jobs]
    summary: Update a job posting
    description: Update an existing job posting (recruiter who owns the job)
    operationId: updateJob
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Job ID (UUID format)
        example: '123e4567-e89b-12d3-a456-426614174000'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateJobRequest'
          example:
            title: 'Senior Full Stack Engineer'
            description: 'Updated job description...'
            salary_range:
              min: 18000000
              max: 30000000
    responses:
      '200':
        description: Job updated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'Job updated successfully'
      '400':
        description: Bad request - Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Only the job owner can update the job
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Job not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  delete:
    tags: [jobs]
    summary: Soft delete a job posting
    description: Soft delete a job posting (recruiter who owns the job)
    operationId: deleteJob
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Job ID (UUID format)
        example: '123e4567-e89b-12d3-a456-426614174000'
    responses:
      '200':
        description: Job deleted successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'Job deleted successfully'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Only the job owner can delete the job
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Job not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

