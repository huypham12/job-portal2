# ============================================
# JOB ENDPOINTS
# ============================================

/jobs:
  post:
    tags: [jobs]
    summary: Create a new job posting
    description: Create a new job posting (requires recruiter authentication)
    operationId: createJob
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateJobRequest'
          example:
            title: 'Senior Software Engineer'
            description: 'We are looking for an experienced software engineer...'
            company_id: '123e4567-e89b-12d3-a456-426614174000'
            location_id: '123e4567-e89b-12d3-a456-426614174001'
            salary_range:
              min: 15000000
              max: 25000000
              currency: 'VND'
            job_type: 'full_time'
            experience_level: 3
            expires_at: '2024-12-31T23:59:59Z'
            requirements:
              - requirement_type: 'technical'
                title: 'Programming Languages'
                description: 'Proficiency in JavaScript/TypeScript'
                is_required: true
                level: 'expert'
                years_experience: 3
            benefits:
              - benefit_type: 'financial'
                title: 'Health Insurance'
                description: 'Comprehensive health insurance coverage'
                value_amount: 5000000
                value_currency: 'VND'
            skill_ids: ['123e4567-e89b-12d3-a456-426614174002']
            category_ids: ['123e4567-e89b-12d3-a456-426614174003']
            work_arrangements:
              is_remote_allowed: true
              remote_percentage: 50
              flexible_hours: true
    responses:
      '201':
        description: Job created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 201
              message: 'Job created successfully'
      '400':
        description: Bad request - Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Recruiter role required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/jobs/{id}/public:
  get:
    tags: [jobs]
    summary: Get job detail (public view)
    description: Get public job details without requiring authentication
    operationId: getJobPublic
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Job ID (UUID format)
        example: '123e4567-e89b-12d3-a456-426614174000'
    responses:
      '200':
        description: Job details retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'Job retrieved successfully'
              data:
                id: '123e4567-e89b-12d3-a456-426614174000'
                title: 'Senior Software Engineer'
                description: 'We are looking for...'
                # ... job details
      '404':
        description: Job not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/jobs/{id}/view:
  post:
    tags: [jobs]
    summary: Track job view
    description: Track when a job is viewed (can be anonymous or authenticated)
    operationId: trackView
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Job ID (UUID format)
        example: '123e4567-e89b-12d3-a456-426614174000'
    responses:
      '200':
        description: View tracked successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'View tracked successfully'

/jobs/my-jobs:
  get:
    tags: [jobs]
    summary: Get all jobs posted by the recruiter
    description: Get paginated list of jobs posted by the authenticated recruiter
    operationId: getMyJobs
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number for pagination
        example: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Number of jobs per page
        example: 20
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/JobStatus'
        description: Filter by job status
        example: 'approved'
      - name: sort_by
        in: query
        schema:
          type: string
          enum: [posted_at, title, expires_at, updated_at]
          default: posted_at
        description: Sort field
        example: posted_at
      - name: sort_order
        in: query
        schema:
          type: string
          enum: [asc, desc]
          default: desc
        description: Sort order
        example: desc
    responses:
      '200':
        description: Jobs retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'Jobs retrieved successfully'
              data:
                jobs: []
                pagination:
                  page: 1
                  limit: 20
                  total: 0
                  totalPages: 0
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Recruiter role required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/jobs/{id}/manage:
  get:
    tags: [jobs]
    summary: Get job details for management
    description: Get detailed job information for management purposes (recruiter who owns the job)
    operationId: getJobForManage
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Job ID (UUID format)
        example: '123e4567-e89b-12d3-a456-426614174000'
    responses:
      '200':
        description: Job details retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'Job retrieved successfully'
              data: {}
      '401':
        description: Unauthorized - Invalid or missing access token
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: Forbidden - Only the job owner can access management details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Job not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

