# ============================================
# JOB ENDPOINTS
# ============================================
/jobs:
  get:
    tags: [jobs]
    summary: List jobs (public)
    parameters:
      - in: query
        name: page
        schema: { type: integer, default: 1 }
      - in: query
        name: limit
        schema: { type: integer, default: 20 }
      - in: query
        name: search
        schema: { type: string }
      - in: query
        name: company_id
        schema: { type: string, format: uuid }
      - in: query
        name: location_id
        schema: { type: string, format: uuid }
      - in: query
        name: job_type
        schema: { $ref: '#/components/schemas/JobType' }
      - in: query
        name: experience_level
        schema: { type: integer }
      - in: query
        name: status
        schema: { $ref: '#/components/schemas/JobStatus' }
      - in: query
        name: salary_min
        schema: { type: integer }
      - in: query
        name: salary_max
        schema: { type: integer }
      - in: query
        name: sort_by
        schema: { type: string, enum: [posted_at, title, salary_min, expires_at], default: posted_at }
      - in: query
        name: sort_order
        schema: { type: string, enum: [asc, desc], default: desc }
    responses:
      '200':
        {
          description: Jobs listed,
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        }
  post:
    tags: [jobs]
    summary: Create job (Recruiter only)
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateJobRequest'
    responses:
      '201':
        {
          description: Job created,
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        }
      '400':
        {
          description: Validation error,
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        }
      '401':
        { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      '403':
        {
          description: Forbidden - Recruiter only,
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        }

/jobs/featured:
  get:
    tags: [jobs]
    summary: Get featured jobs (public)
    responses:
      '200': { description: OK }

/jobs/latest:
  get:
    tags: [jobs]
    summary: Get latest jobs (public)
    responses:
      '200': { description: OK }

/jobs/popular:
  get:
    tags: [jobs]
    summary: Get popular jobs based on view counts
    parameters:
      - in: query
        name: limit
        schema: { type: integer, default: 10 }
    responses:
      '200': { description: OK }

/jobs/trending:
  get:
    tags: [jobs]
    summary: Get trending jobs with high growth rate
    parameters:
      - in: query
        name: limit
        schema: { type: integer, default: 10 }
    responses:
      '200': { description: OK }

/jobs/popular-by-location:
  get:
    tags: [jobs]
    summary: Get popular jobs grouped by location
    parameters:
      - in: query
        name: limit
        schema: { type: integer, default: 10 }
    responses:
      '200': { description: OK }

/jobs/{id}/public:
  get:
    tags: [jobs]
    summary: Get job detail public
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: OK }
      '404': { description: Not found }

/jobs/{id}/view:
  post:
    tags: [jobs]
    summary: Track job view
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: OK }

/jobs/my-jobs:
  get:
    tags: [jobs]
    summary: List my jobs (Recruiter)
    security: [{ bearerAuth: [] }]
    parameters:
      - in: query
        name: page
        schema: { type: integer, default: 1 }
      - in: query
        name: limit
        schema: { type: integer, default: 20 }
      - in: query
        name: status
        schema: { $ref: '#/components/schemas/JobStatus' }
    responses:
      '200': { description: OK }
      '401': { description: Unauthorized }
      '403': { description: Forbidden }

/jobs/{id}/manage:
  get:
    tags: [jobs]
    summary: Get job detail for management (Recruiter)
    security: [{ bearerAuth: [] }]
    parameters:
