      '200': { description: Updated }
      '400': { description: Validation error }
      '401': { description: Unauthorized }
      '403': { description: Forbidden }
  delete:
    tags: [jobs]
    summary: Delete job (Recruiter)
    security: [{ bearerAuth: [] }]
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200': { description: Deleted }
      '401': { description: Unauthorized }
      '403': { description: Forbidden }

