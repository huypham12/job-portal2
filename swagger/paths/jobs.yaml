/jobs/bulk-actions:
  post:
    tags: [jobs]
    summary: Perform bulk actions on multiple jobs
    description: Perform bulk actions (close, delete) on multiple jobs owned by the recruiter
    operationId: bulkJobActions
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkJobActionsRequest'
          example:
            action: 'close'
            job_ids:
              - '123e4567-e89b-12d3-a456-426614174000'
              - '123e4567-e89b-12d3-a456-426614174001'
    responses:
      '200':
        description: Bulk actions completed successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuccessResponse'
            example:
              statusCode: 200
              message: 'Bulk actions completed successfully'
