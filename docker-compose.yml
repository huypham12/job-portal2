services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-portal-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - job-portal-net
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:18
    container_name: job-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-job_portal}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - job-portal-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    container_name: job-portal-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'true'
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:-1234}
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
      cluster.routing.allocation.disk.watermark.low: '85%'
      cluster.routing.allocation.disk.watermark.high: '90%'
      cluster.routing.allocation.disk.watermark.flood_stage: '95%'
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - job-portal-net
    healthcheck:
      test: ['CMD-SHELL', 'curl -u elastic:${ELASTICSEARCH_PASSWORD:-1234} -f http://localhost:9200/_cluster/health']
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: job-portal-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-1234}
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy volatile-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --dir /data
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - job-portal-net
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', '${REDIS_PASSWORD:-1234}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.2
    container_name: job-portal-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: ${ELASTICSEARCH_HOSTS:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTIC_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-1234}
      SERVER_PUBLICBASEURL: ${KIBANA_PUBLIC_URL:-http://localhost:5601}
    ports:
      - '${KIBANA_PORT:-5601}:5601'
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - job-portal-net

networks:
  job-portal-net:
    driver: bridge

volumes:
  postgres_data:
  es_data:
  redis_data:
