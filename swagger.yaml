                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  profiles:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        phone:
                          type: string
            pagination:
              type: object
              properties:
                total:
                  type: integer
                  example: 100
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 20
                totalPages:
                  type: integer
                  example: 5

    UserDetailsResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Lấy thông tin chi tiết người dùng thành công.'
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            role:
              $ref: '#/components/schemas/UserRole'
            verified:
              type: boolean
            deleted:
              type: boolean
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            profiles:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  phone:
                    type: string
                  location_id:
                    type: string
                    format: uuid
                    nullable: true
                  metadata:
                    type: object
                    additionalProperties: true

    AdminUpdateUserResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Cập nhật tài khoản thành công.'
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            role:
              $ref: '#/components/schemas/UserRole'
            verified:
              type: boolean
            deleted:
              type: boolean
            updated_at:
              type: string
              format: date-time
