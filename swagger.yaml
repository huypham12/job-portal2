openapi: 3.0.4
info:
  title: Job Portal API
  description: |-
    API documentation for Job Portal - A comprehensive job search and recruitment platform.

    This API provides endpoints for authentication, user management, and administrative operations.
  version: 1.0.0
  contact:
    email: support@jobportal.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://api.jobportal.com/api
    description: Production server

tags:
  - name: auth
    description: Authentication operations (register, login, logout, password management)
  - name: user
    description: User profile management operations
  - name: admin
    description: Administrative operations (user management, system administration)
  - name: companies
    description: Company profile management operations

paths:
  # ============================================
  # AUTH ENDPOINTS
  # ============================================
  /auth/register:
    post:
      tags:
        - auth
      summary: Register a new user account
      description: |-
        Register a new user account with email, password, name, and date of birth.
        After successful registration, a verification email will be sent to the user's email address.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: 'John Doe'
              email: 'john.doe@example.com'
              password: 'P@ssw0rd123'
              confirm_password: 'P@ssw0rd123'
              date_of_birth: '1990-01-01'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                statusCode: 201
                message: 'Register success, please check your email to verify your account'
                data:
                  access_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  refresh_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '400':
          description: Bad request - Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - auth
      summary: User login
      description: Authenticate user with email and password. Returns access token and refresh token.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: 'john.doe@example.com'
              password: 'P@ssw0rd123'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                statusCode: 200
                message: 'Login success'
                data:
                  access_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  refresh_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '400':
          description: Bad request - Validation error or user does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - auth
      summary: User logout
      description: Logout user and invalidate refresh token. Requires valid access token in Authorization header and refresh token in body.
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refresh_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                message: 'Logout success'
        '400':
          description: Bad request - Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh-token:
    post:
      tags:
        - auth
      summary: Refresh access token
      description: Get new access token and refresh token using a valid refresh token.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refresh_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      responses:
        '201':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
              example:
                statusCode: 201
                message: 'Refresh token success'
                data:
                  access_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  refresh_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '400':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Token expired or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/resend-verify-email:
    post:
      tags:
        - auth
      summary: Resend email verification
      description: Resend email verification link to user's email address.
      operationId: resendVerifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: 'john.doe@example.com'
      responses:
        '200':
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                message: 'Resend verify email success'
        '400':
          description: Bad request - Invalid email or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Email does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-email:
    post:
      tags:
        - auth
      summary: Verify email address
      description: Verify user email using verification token sent via email.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              token: 'verification-token-here'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
              example:
                statusCode: 200
                message: 'Verify email success'
                data:
                  message: 'Email verified successfully'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/forgot-password:
    post:
      tags:
        - auth
      summary: Request password reset
      description: Send password reset link to user's email address.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            example:
              email: 'john.doe@example.com'
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                message: 'Forgot password success, please check your email to reset your password'
        '400':
          description: Bad request - Invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Email does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-forgot-password:
    post:
      tags:
        - auth
      summary: Verify password reset token
      description: Verify password reset token from email link before allowing password reset. Token should be sent in Authorization header as Bearer token.
      operationId: verifyForgotPassword
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Token verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                message: 'Verify forgot password token success'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/reset-password:
    post:
      tags:
        - auth
      summary: Reset password
      description: Reset user password using verified reset token. Token should be sent in Authorization header as Bearer token. Returns new access and refresh tokens.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: 'verified-reset-token'
              new_password: 'NewP@ssw0rd123'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
              example:
                statusCode: 200
                message: 'Password reset success'
                data:
                  access_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  refresh_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '400':
          description: Invalid token or password validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/change-password:
    patch:
      tags:
        - auth
      summary: Change password
      description: Change user password (requires authentication and verified account).
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              old_password: 'OldP@ssw0rd123'
              new_password: 'NewP@ssw0rd123'
              confirm_password: 'NewP@ssw0rd123'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                message: 'Change password success'
        '400':
          description: Bad request - Validation error or incorrect old password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - User not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # USER ENDPOINTS
  # ============================================
  /user/me:
    get:
      tags:
        - user
      summary: Get current user profile
      description: Get detailed information about the currently authenticated user including profile, companies (for recruiters), and resumes (for candidates).
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                id: '123e4567-e89b-12d3-a456-426614174000'
                email: 'john.doe@example.com'
                role: 'candidate'
                verified: true
                profiles:
                  - name: 'John Doe'
                    phone: '+1234567890'
                    metadata:
                      avatar: 'https://example.com/avatar.jpg'
                      bio: 'Software developer'
                companies: []
                resumes:
                  - id: '123e4567-e89b-12d3-a456-426614174001'
                    content:
                      skills: ['JavaScript', 'TypeScript']
                      experience_years: 5
                    file_url: 'https://example.com/resume.pdf'
                    updated_at: '2024-01-01T00:00:00.000Z'
        '401':
          description: Unauthorized - Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/me/profile:
    put:
      tags:
        - user
      summary: Update user profile
      description: Update profile information for the currently authenticated user. At least one field must be provided.
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              name: 'John Doe Updated'
              phone: '+1234567890'
              location_id: '123e4567-e89b-12d3-a456-426614174000'
              metadata:
                avatar: 'https://example.com/avatar.jpg'
                bio: 'Updated bio'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfileResponse'
              example:
                message: 'Profile updated'
                profile:
                  id: '123e4567-e89b-12d3-a456-426614174002'
                  user_id: '123e4567-e89b-12d3-a456-426614174000'
                  name: 'John Doe Updated'
                  phone: '+1234567890'
                  location_id: '123e4567-e89b-12d3-a456-426614174000'
                  metadata:
                    avatar: 'https://example.com/avatar.jpg'
                    bio: 'Updated bio'
                  updated_at: '2024-01-01T00:00:00.000Z'
                  created_at: '2024-01-01T00:00:00.000Z'
        '400':
          description: Bad request - Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # ADMIN ENDPOINTS
  # ============================================
  /admin/users:
    get:
      tags:
        - admin
      summary: Get all users (Admin only)
      description: |-
        Get paginated list of all users with optional filtering and search.
        Requires admin role and verified account.
      operationId: getAllUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: 'Page number (default: 1)'
          required: false
          schema:
            type: string
            default: '1'
          example: '1'
        - name: limit
          in: query
          description: 'Number of items per page (default: 10)'
          required: false
          schema:
            type: string
            default: '10'
          example: '20'
        - name: search
          in: query
          description: Search by email or name
          required: false
          schema:
            type: string
          example: 'john'
        - name: role
          in: query
          description: Filter by user role
          required: false
          schema:
            $ref: '#/components/schemas/UserRole'
          example: 'candidate'
        - name: verified
          in: query
          description: Filter by verification status
          required: false
          schema:
            type: string
            enum: ['true', 'false']
          example: 'true'
        - name: deleted
          in: query
          description: Filter by deleted status (soft delete)
          required: false
          schema:
            type: string
            enum: ['true', 'false']
          example: 'false'
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllUsersResponse'
              example:
                message: 'Lấy danh sách người dùng thành công.'
                data:
                  users:
                    - id: '123e4567-e89b-12d3-a456-426614174000'
                      email: 'john.doe@example.com'
                      role: 'candidate'
                      verified: true
                      deleted: false
                      created_at: '2024-01-01T00:00:00.000Z'
                      updated_at: '2024-01-01T00:00:00.000Z'
                      profiles:
                        - name: 'John Doe'
                          phone: '+1234567890'
                  pagination:
                    total: 100
                    page: 1
                    limit: 20
                    totalPages: 5
        '401':
          description: Unauthorized - Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity - Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users/{userId}:
    get:
      tags:
        - admin
      summary: Get user details by ID (Admin only)
      description: |-
        Get detailed information about a specific user by their ID.
        Requires admin role and verified account.
      operationId: getUserDetails
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          description: User ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
      responses:
        '200':
          description: User details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailsResponse'
              example:
                message: 'Lấy thông tin chi tiết người dùng thành công.'
                data:
                  id: '123e4567-e89b-12d3-a456-426614174000'
                  email: 'john.doe@example.com'
                  role: 'candidate'
                  verified: true
                  deleted: false
                  created_at: '2024-01-01T00:00:00.000Z'
                  updated_at: '2024-01-01T00:00:00.000Z'
                  profiles:
                    - id: '123e4567-e89b-12d3-a456-426614174001'
                      name: 'John Doe'
                      phone: '+1234567890'
                      location_id: '123e4567-e89b-12d3-a456-426614174002'
                      metadata:
                        avatar: 'https://example.com/avatar.jpg'
        '401':
          description: Unauthorized - Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity - Validation error (invalid UUID format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - admin
      summary: Update user (Admin only)
      description: |-
        Admin can update user information including role, verification status, and lock/unlock account (soft delete).
        Requires admin role and verified account.
        At least one field must be provided in the request body.
      operationId: adminUpdateUser
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          description: User ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
            example:
              role: 'recruiter'
              verified: true
              deleted: false
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUpdateUserResponse'
              example:
                message: 'Cập nhật tài khoản thành công.'
                data:
                  id: '123e4567-e89b-12d3-a456-426614174000'
                  email: 'john.doe@example.com'
                  role: 'recruiter'
                  verified: true
                  deleted: false
                  updated_at: '2024-01-01T00:00:00.000Z'
        '400':
          description: Bad request - Validation error or body is empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity - Validation error (invalid UUID format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - admin
      summary: Delete user permanently (Admin only)
      description: |-
        Permanently delete a user from the system (hard delete).
        This action cannot be undone.
        Requires admin role and verified account.
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          description: User ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: 'Xóa tài khoản người dùng thành công.'
        '401':
          description: Unauthorized - Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity - Validation error (invalid UUID format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # COMPANY ENDPOINTS
  # ============================================
  /companies:
    post:
      tags:
        - companies
      summary: Create company profile (Recruiter only)
      description: |-
        Create a new company profile for the authenticated recruiter.
        Each recruiter can only create one company profile.
        Requires recruiter role and authentication.
      operationId: createCompany
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
            example:
              name: 'Công ty Cổ phần Công nghệ ABC'
              description: 'Chuyên cung cấp giải pháp phần mềm cho doanh nghiệp'
              logo_url: 'https://example.com/logo.png'
              size: 100
              metadata:
                website: 'https://abc-tech.com'
                industry: 'Technology'
                benefits: ['Health insurance', 'Flexible working hours']
      responses:
        '201':
          description: Company profile created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCompanyResponse'
              example:
                message: 'Create company success'
                data:
                  id: '123e4567-e89b-12d3-a456-426614174000'
                  name: 'Công ty Cổ phần Công nghệ ABC'
                  description: 'Chuyên cung cấp giải pháp phần mềm cho doanh nghiệp'
                  recruiter_id: '123e4567-e89b-12d3-a456-426614174001'
                  logo_url: 'https://example.com/logo.png'
                  size: 100
                  metadata:
                    website: 'https://abc-tech.com'
                    industry: 'Technology'
                    benefits: ['Health insurance', 'Flexible working hours']
