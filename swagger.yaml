        completed_at:
          type: string
          description: ISO 8601 datetime format (e.g., '2024-01-01T00:00:00.000Z')
          example: '2024-01-01T00:00:00.000Z'

    CreateApplicationStageRequest:
      type: object
      required: [stage_name, stage_order]
      properties:
        stage_name: { type: string, minLength: 1, maxLength: 100 }
        stage_order:
          oneOf:
            - type: integer
              minimum: 1
            - type: string
              description: Will be converted to positive integer
          description: Stage order (accepts integer or string that will be converted to positive integer)
        scheduled_at:
          type: string
          description: ISO 8601 datetime format (e.g., '2024-01-01T00:00:00.000Z')
          example: '2024-01-01T00:00:00.000Z'
        interviewer_notes: { type: string }

    AddApplicationNoteRequest:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1 }

    ContactCandidateRequest:
      type: object
      required: [subject, message]
      properties:
        subject: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        send_email:
          oneOf:
            - type: boolean
            - type: string
              enum: ['true', 'false', '1', '0', '']
              description: Will be converted to boolean ('true'/'1' = true, 'false'/'0'/'' = false)
          default: false
          description: Whether to send email notification (accepts boolean or string that will be converted)

    BulkUpdateApplicationsRequest:
      type: object
      required: [application_ids, action]
      properties:
        application_ids:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
        action:
          type: string
          enum: [reject, accept, review]
        reason: { type: string }

    # ============================================
    # Connection Interest Schemas
    # ============================================
    CreateConnectionInterestRequest:
      type: object
      required: [candidate_id, interest_type]
      properties:
        candidate_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        interest_type:
          type: string
          enum: [job_invitation, profile_view, network_connection]
        message: { type: string }
        contact_info:
          type: object
          properties:
            email: { type: string, format: email }
            phone: { type: string }

    RespondConnectionInterestRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accept, reject]
        message: { type: string }

    # ============================================
    # Admin Job Schemas
    # ============================================
    RejectJobRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500 }

    LabelJobRequest:
      type: object
      properties:
        hot: { type: boolean }
        urgent: { type: boolean }
        featured: { type: boolean }
      description: At least one of hot/urgent/featured should be provided
