components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT token obtained from login or register endpoint. Format: "Bearer {token}"'

  schemas:
    # ============================================
    # Base Response Schemas
    # ============================================
    SuccessResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: 'Operation successful'
      required:
        - statusCode
        - message

    Error:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
          description: HTTP status code
        message:
          type: string
          example: 'Validation failed'
          description: Error message describing what went wrong
        error:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            'body.email': ['Email must be valid']
            'body.password': ['Password is required']
          description: Detailed validation errors (optional, only present for validation failures)
      required:
        - statusCode
        - message

    # ============================================
    # Enums
    # ============================================
    UserRole:
      type: string
      enum:
        - candidate
        - recruiter
        - admin
      example: 'candidate'
      description: User role in the system

    # ============================================
    # Auth Request Schemas
    # ============================================
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - confirm_password
        - date_of_birth
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 'John Doe'
          description: User's full name (1-100 characters)
        email:
          type: string
          format: email
          example: 'user@example.com'
          description: User's email address
        password:
          type: string
          minLength: 6
          example: 'P@ssw0rd123'
          description: |-
            Password must contain at least 6 characters with:
            - At least one uppercase letter
            - At least one lowercase letter
            - At least one number
            - At least one special character
        confirm_password:
          type: string
          minLength: 6
          example: 'P@ssw0rd123'
          description: Must match the password field
        date_of_birth:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '1990-01-01'
          description: Date of birth in YYYY-MM-DD format

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'user@example.com'
        password:
          type: string
          example: 'P@ssw0rd123'

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'

    EmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: 'user@example.com'

    TokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: 'verification-token-here'

    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
        - confirm_password
      properties:
        old_password:
          type: string
          example: 'OldP@ssw0rd123'
          description: Current password
        new_password:
          type: string
          minLength: 6
          example: 'NewP@ssw0rd123'
          description: |-
            New password must contain at least 6 characters with:
            - At least one uppercase letter
            - At least one lowercase letter
            - At least one number
            - At least one special character
        confirm_password:
          type: string
          minLength: 6
          example: 'NewP@ssw0rd123'
          description: Must match the new password field

    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          example: 'verified-reset-token'
          description: The verified reset token (also sent in Authorization header)
        new_password:
          type: string
          minLength: 6
          example: 'NewP@ssw0rd123'
          description: |-
            New password must contain at least 6 characters with:
            - At least one uppercase letter
            - At least one lowercase letter
            - At least one number
            - At least one special character

    # ============================================
    # Auth Response Schemas
    # ============================================
    TokenData:
      type: object
      properties:
        access_token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        refresh_token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
      required:
        - access_token
        - refresh_token

    RegisterResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenData'

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenData'

    RefreshTokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenData'

    ResetPasswordResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenData'

    VerifyEmailResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                message:
                  type: string
                  example: 'Email verified successfully'

    # ============================================
    # User Request Schemas
    # ============================================
    UpdateProfileRequest:
      type: object
      description: At least one field must be provided
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 'John Doe'
          description: User's full name (1-100 characters)
        phone:
          type: string
          pattern: '^\+?[0-9\s\-().]{7,20}$'
          example: '+1234567890'
          description: Phone number in international format
        location_id:
          type: string
          format: uuid
          nullable: true
          example: '123e4567-e89b-12d3-a456-426614174000'
          description: Location ID (UUID) or null
        metadata:
          type: object
          additionalProperties: true
          example:
            avatar: 'https://example.com/avatar.jpg'
            bio: 'Software developer'
          description: Additional metadata as JSON object

    # ============================================
    # User Response Schemas
    # ============================================
    UserProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        email:
          type: string
          format: email
          example: 'john.doe@example.com'
        role:
          $ref: '#/components/schemas/UserRole'
        verified:
          type: boolean
          example: true
        profiles:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: 'John Doe'
              phone:
                type: string
                example: '+1234567890'
              metadata:
                type: object
                additionalProperties: true
                example:
                  avatar: 'https://example.com/avatar.jpg'
                  bio: 'Software developer'
        companies:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              logo_url:
                type: string
              size:
                type: string
          description: Companies associated with the user (for recruiters)
        resumes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              content:
                type: object
                additionalProperties: true
                example:
                  skills: ['JavaScript', 'TypeScript']
                  experience_years: 5
              file_url:
                type: string
              updated_at:
                type: string
                format: date-time

    # ============================================
    # Company Request Schemas
    # ============================================
    CreateCompanyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          example: 'Công ty Cổ phần Công nghệ ABC'
          description: Company name (minimum 3 characters)
        description:
          type: string
          example: 'Chuyên cung cấp giải pháp phần mềm cho doanh nghiệp'
          description: Company description (optional)
        logo_url:
          type: string
          format: url
          example: 'https://example.com/logo.png'
          description: Company logo URL (optional)
        size:
          type: integer
          minimum: 1
          example: 100
          description: Company size (number of employees, optional)
        metadata:
          type: object
          additionalProperties: true
          example:
            website: 'https://abc-tech.com'
            industry: 'Technology'
            benefits: ['Health insurance', 'Flexible working hours']
          description: Additional company metadata as JSON object (optional)

    UpdateCompanyRequest:
      type: object
      description: At least one field must be provided
      properties:
        name:
          type: string
          minLength: 3
          example: 'Công ty Cổ phần Công nghệ ABC'
          description: Company name (minimum 3 characters)
        description:
          type: string
          example: 'Mô tả mới cập nhật về công ty'
          description: Company description
        logo_url:
          type: string
          format: url
          example: 'https://new-logo-url.com/logo.png'
          description: Company logo URL
        size:
          type: integer
          minimum: 1
          example: 150
          description: Company size (number of employees)
        metadata:
          type: object
          additionalProperties: true
          example:
            website: 'https://abc-tech-updated.com'
            remote_work: true
          description: Additional company metadata as JSON object

    # ============================================
    # Company Response Schemas
    # ============================================
    CompanyData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
          description: Company unique identifier
        name:
          type: string
          example: 'Công ty Cổ phần Công nghệ ABC'
          description: Company name
        description:
          type: string
          nullable: true
          example: 'Chuyên cung cấp giải pháp phần mềm cho doanh nghiệp'
          description: Company description
        recruiter_id:
          type: string
          format: uuid
          nullable: true
          example: '123e4567-e89b-12d3-a456-426614174001'
          description: ID of the recruiter who owns this company
        logo_url:
          type: string
          nullable: true
          example: 'https://example.com/logo.png'
          description: Company logo URL
        size:
          type: integer
          nullable: true
          example: 100
          description: Company size (number of employees)
        metadata:
          type: object
          additionalProperties: true
          nullable: true
          example:
            website: 'https://abc-tech.com'
            industry: 'Technology'
            benefits: ['Health insurance', 'Flexible working hours']
          description: Additional company metadata as JSON object
        created_at:
          type: string
          format: date-time
          nullable: true
          example: '2024-01-01T00:00:00.000Z'
          description: Company creation timestamp
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2024-01-01T00:00:00.000Z'
          description: Company last update timestamp
      required:
        - id
        - name

    CreateCompanyResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CompanyData'

    GetCompanyResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CompanyData'

    UpdateCompanyResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CompanyData'
          description: Resumes associated with the user (for candidates)

    UpdateProfileResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Profile updated'
        profile:
          type: object
          properties:
            id:
              type: string
              format: uuid
            user_id:
              type: string
              format: uuid
            name:
              type: string
            phone:
              type: string
            location_id:
              type: string
              format: uuid
              nullable: true
            metadata:
              type: object
              additionalProperties: true
            updated_at:
              type: string
              format: date-time
            created_at:
              type: string
              format: date-time

    # ============================================
    # Admin Request Schemas
    # ============================================
    AdminUpdateUserRequest:
      type: object
      description: At least one field must be provided
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
          description: Change user role
        verified:
          type: boolean
          example: true
          description: Manually verify user email
        deleted:
          type: boolean
          example: false
          description: 'true to lock account (soft delete), false to unlock'

    # ============================================
    # Admin Response Schemas
    # ============================================
