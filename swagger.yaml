  # ============================================
  # JOB ENDPOINTS
  # ============================================
  /jobs:
    get:
      tags: [jobs]
      summary: List jobs (public)
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: company_id
          schema: { type: string, format: uuid }
        - in: query
          name: location_id
          schema: { type: string, format: uuid }
        - in: query
          name: job_type
          schema: { $ref: '#/components/schemas/JobType' }
        - in: query
          name: experience_level
          schema: { type: integer }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/JobStatus' }
        - in: query
          name: salary_min
          schema: { type: integer }
        - in: query
          name: salary_max
          schema: { type: integer }
        - in: query
          name: sort_by
          schema: { type: string, enum: [posted_at, title, salary_min, expires_at], default: posted_at }
        - in: query
          name: sort_order
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200': { description: Jobs listed, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
    post:
      tags: [jobs]
      summary: Create job (Recruiter only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201': { description: Job created, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden - Recruiter only, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

